<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PROJECT SUROKKHA-X</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.vault{width:100%;max-width:420px;background:linear-gradient(145deg,#1a1a2e,#16213e);border-radius:24px;padding:32px;border:1px solid #ffffff15}.logo{text-align:center;margin-bottom:20px}.logo h1{font-size:22px;letter-spacing:3px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}.status{display:flex;align-items:center;justify-content:center;gap:8px;background:#10b98115;border:1px solid #10b98130;border-radius:999px;padding:8px 16px;margin:0 auto 20px;width:fit-content;font-size:12px;color:#10b981}.dot{width:8px;height:8px;background:#10b981;border-radius:50%;animation:p 2s infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.5}}.pin-box{background:#00000050;border-radius:16px;padding:20px;border:1px solid #ffffff10}input{width:100%;background:#00000080;border:1px solid #ffffff15;border-radius:12px;padding:14px;color:#fff;font-size:18px;text-align:center;letter-spacing:8px;margin-top:10px;outline:none}button{width:100%;margin-top:16px;background:linear-gradient(90deg,#6366f1,#8b5cf6);border:none;border-radius:12px;padding:14px;font-weight:700;color:#fff;cursor:pointer}#vaultContent{display:none}.card{background:#ffffff06;border:1px solid #ffffff10;border-radius:12px;padding:16px;margin-top:12px}</style></head><body>
<div class="vault"><div class="logo"><h1>PROJECT SUROKKHA-X</h1><p style="color:#ffffff60;font-size:11px;letter-spacing:2px">WWW.PROJECTSUROKKHAX.COM</p></div>
<div class="status"><div class="dot"></div> LIVE ON GITHUB ✅</div>
<div id="lockScreen"><div class="pin-box"><label style="font-size:11px;color:#ffffff80">🔐 3D SECURE VAULT - ENTER PIN</label><input id="pin" type="password" placeholder="••••"><button onclick="unlock()">UNLOCK VAULT</button></div></div>
<div id="vaultContent"><div class="pin-box" style="text-align:center"><h2>🔓 VAULT UNLOCKED</h2><p style="color:#10b981;font-size:11px;margin-top:6px">No Redirect - No 404 - 100% Working</p></div><div class="card"><h3>📦 CORE</h3><p style="font-size:12px;color:#ffffff70">Vault restored after force rebuild. Now 100% working.</p></div><button onclick="lock()" style="background:#ffffff10">LOCK AGAIN</button></div></div>
<script>function unlock(){if(document.getElementById('pin').value.length>=4){document.getElementById('lockScreen').style.display='none';document.getElementById('vaultContent').style.display='block'}}function lock(){document.getElementById('lockScreen').style.display='block';document.getElementById('vaultContent').style.display='none';document.getElementById('pin').value=''}</script></div></body></html>
