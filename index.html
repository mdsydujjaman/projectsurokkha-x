<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>LOCKED v13</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#00ff88;font-family:monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;touch-action:manipulation}.lock{border:2px solid #00ff88;border-radius:20px;padding:24px;width:92%;max-width:380px;text-align:center;background:#111;box-shadow:0 0 40px #00ff8855}h1{font-size:26px}.sub{color:#888;font-size:12px;margin:10px 0 16px}.dots{display:flex;gap:12px;justify-content:center;margin:18px 0}.dot{width:18px;height:18px;border:2px solid #00ff88;border-radius:50%;transition:.2s}.dot.on{background:#00ff88;box-shadow:0 0 10px #00ff88}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}button{height:62px;background:#1e1e1e;border:1px solid #333;border-radius:14px;color:#fff;font-size:22px;font-weight:bold;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:active{background:#00ff88;color:#000;transform:scale(.94)}button.c{background:#ff2a2a}button.ok{background:#00ff88;color:#000;font-size:20px}#msg{height:22px;margin-top:14px;font-size:14px;font-weight:bold}.hint{margin-top:10px;font-size:11px;color:#555}</style></head>
<body><div class="lock"><h1>🔐 SUROKKHA-X</h1><div class="sub">MAIN VAULT - Refresh = Lock<br>PIN 1234 (v13 single tap)</div><div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div><div class="pad"><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button class="c" data-c="1">C</button><button data-n="0">0</button><button class="ok" data-ok="1">OK</button></div><div id="msg">PIN দাও: 1 2 3 4</div><div class="hint">Direct: <a href="./dashboard.html?unlock=1234" style="color:#00ff88">dashboard bypass</a></div></div>
<script>
let pin="",lastTap=0;
function upd(){for(let i=0;i<4;i++)document.getElementById('d'+i).className=i<pin.length?'dot on':'dot';document.getElementById('msg').innerText=pin.length?`Entered: ${pin} (${pin.length}/4)`: 'PIN দাও: 1 2 3 4';document.getElementById('msg').style.color='#0f8';}
function p(n){if(pin.length>=4)return;pin+=n;upd();if(pin.length==4)setTimeout(go,300);}
function clr(){pin="";upd();document.getElementById('msg').innerText='Clear!';document.getElementById('msg').style.color='#888';}
function go(){let m=document.getElementById('msg');if(pin.length<4){m.innerText=`❌ ${pin.length} টা দিয়েছো, 4 টা লাগবে!`;m.style.color='#f44';return;}if(pin!=="1234"){m.innerText=`❌ Wrong: ${pin}`;m.style.color='#f44';pin="";upd();return;}m.innerText='✅ OK! যাচ্ছি...';m.style.color='#0f8';try{sessionStorage.setItem("surokkha_temp","1");localStorage.setItem("surokkha_temp","1");}catch(e){}setTimeout(()=>location.href="./dashboard.html",500);}
function tapHandler(e){
  e.preventDefault();
  const now=Date.now();
  if(now-lastTap<500)return; // double fire block
  lastTap=now;
  const t=e.currentTarget;
  if(t.dataset.n!==undefined)p(t.dataset.n);
  if(t.dataset.c!==undefined)clr();
  if(t.dataset.ok!==undefined)go();
}
document.querySelectorAll('button').forEach(b=>{
  b.addEventListener('touchstart',tapHandler,{passive:false});
  b.addEventListener('click',tapHandler);
});
upd();
</script></body></html>
