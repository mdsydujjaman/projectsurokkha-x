<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAB v5 - AUTO CONNECT</title>
<style>
*{box-sizing:border-box;font-family:monospace}
body{background:#000;color:#0f0;padding:15px}
.box{border:1px solid #0f0;border-radius:12px;padding:15px;margin:10px 0}
input{width:100%;padding:12px;background:#111;color:#0f0;border:1px solid #0f0;border-radius:8px;margin:8px 0;font-size:16px}
button{width:100%;padding:14px;background:#0f0;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:18px;margin-top:10px}
#log{white-space:pre-wrap;background:#111;padding:10px;border-radius:8px;margin-top:15px;color:#0ff;max-height:300px;overflow:auto}
</style>
</head>
<body>
<h2>🔐 LAB v5 - AUTO CONNECT</h2>
<div class="box">
<b>Logic:</b> Project Name যেটাই লিখো Repo তে মিলবে সেটাই Connect হবে<br>
Step থাকলে দিবে, না থাকলে খালি রাখবে
</div>
<div class="box">
<label>project name:</label>
<input id="projectName" placeholder="surokkha, doinik, proyojon...">
<label>project step (optional):</label>
<input id="projectStep" placeholder="FINAL-V2-LOCKED বা খালি">
<button onclick="smartConnect()">🔐 SECURE BACKUP NOW</button>
<div id="log">Ready... Project Name লিখে বাটন চাপো</div>
</div>
<script>
async function smartConnect(){
  const projectName=document.getElementById('projectName').value.trim();
  const projectStep=document.getElementById('projectStep').value.trim();
  const log=document.getElementById('log');
  if(!projectName){log.textContent='❌ Project Name লিখো!';return;}
  log.textContent=`⏳ Connecting... Input: ${projectName} | Step: ${projectStep||'(no step)'}`;
  try{
    const res=await fetch('/api/secure-backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({projectName,projectStep:projectStep||''})});
    const data=await res.json();
    if(data.ok){
      log.textContent=`✅ AUTO CONNECTED!\n\nতুমি লিখেছিলে: ${data.info.inputName} | Step: ${data.info.inputStep}\nRepo তে মিলেছে: ${data.info.autoMatched}\nFinal: ${data.info.finalProjectName} / ${data.info.finalStep}\nPath: ${data.info.targetDir}`;
    }else{log.textContent='❌ Error:'+JSON.stringify(data,null,2);}
  }catch(e){log.textContent='❌ Error:'+e.message;}
}
</script>
</body>
</html>
