<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT SUROKKHA-X - LOCKED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#00ff88;font-family:monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#12121a;border:2px solid #00ff88;border-radius:20px;padding:30px;width:100%;max-width:400px;box-shadow:0 0 30px rgba(0,255,136,0.3);text-align:center}
h1{font-size:24px;margin-bottom:10px;letter-spacing:2px}
.sub{color:#888;font-size:13px;margin-bottom:25px}
.pin-dots{display:flex;gap:12px;justify-content:center;margin:20px 0}
.dot{width:18px;height:18px;border:2px solid #00ff88;border-radius:50%;transition:0.2s}
.dot.filled{background:#00ff88;box-shadow:0 0 10px #00ff88}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.key{height:60px;background:#1a1a26;border:1px solid #333;border-radius:12px;color:#fff;font-size:22px;font-weight:bold;cursor:pointer;transition:0.15s}
.key:active{transform:scale(0.92);background:#00ff88;color:#000}
.key.clear{background:#ff3344;border-color:#ff3344;color:white}
.key.ok{background:#00ff88;color:#000}
.msg{height:20px;margin-top:15px;font-size:14px}.msg.error{color:#ff3344}.msg.ok{color:#00ff88}
.footer{margin-top:20px;font-size:11px;color:#555}
</style>
</head>
<body>
<div class="card">
<h1>🔐 SUROKKHA-X</h1>
<div class="sub">ENTER 4-DIGIT PIN TO UNLOCK<br>Backup Vault is Locked</div>
<div class="pin-dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div class="keypad">
<button class="key" onclick="press('1')">1</button>
<button class="key" onclick="press('2')">2</button>
<button class="key" onclick="press('3')">3</button>
<button class="key" onclick="press('4')">4</button>
<button class="key" onclick="press('5')">5</button>
<button class="key" onclick="press('6')">6</button>
<button class="key" onclick="press('7')">7</button>
<button class="key" onclick="press('8')">8</button>
<button class="key" onclick="press('9')">9</button>
<button class="key clear" onclick="clearPin()">C</button>
<button class="key" onclick="press('0')">0</button>
<button class="key ok" onclick="check()">✔</button>
</div>
<div class="msg" id="msg"></div>
<div class="footer">Default PIN: 1234 | Permanent Backup Vault</div>
</div>
<script>
let pin="";const CORRECT="1234";const dots=document.querySelectorAll(".dot");const msg=document.getElementById("msg");
function updateDots(){dots.forEach((d,i)=>{d.classList.toggle("filled", i < pin.length)})}
function press(n){if(pin.length<4){pin+=n;updateDots();if(pin.length===4)setTimeout(check,200)}}
function clearPin(){pin="";updateDots();msg.textContent="";msg.className="msg"}
function check(){
 if(pin.length!==4){msg.textContent="Enter 4 digits";msg.className="msg error";return}
 if(pin===CORRECT){msg.textContent="✅ UNLOCKED - Redirecting...";msg.className="msg ok";localStorage.clear();sessionStorage.clear();setTimeout(()=>{window.location.href="./dashboard.html";},600);}
 else{msg.textContent="❌ Wrong PIN! Try 1234";msg.className="msg error";pin="";updateDots();}
}
</script>
</body>
</html>
