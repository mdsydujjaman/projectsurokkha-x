<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUROKKHA-X - PIN LOCK</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:monospace;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}.card{background:#111;border:1px solid #00ff88;border-radius:20px;padding:30px;width:100%;max-width:380px;box-shadow:0 0 30px rgba(0,255,136,.2)}h1{color:#00ff88;text-align:center;font-size:22px;letter-spacing:2px}.sub{text-align:center;color:#888;font-size:12px;margin:10px 0 20px}.dots{display:flex;gap:12px;justify-content:center;margin:20px 0}.dot{width:18px;height:18px;border:2px solid #333;border-radius:50%;transition:.2s}.dot.fill{background:#00ff88;border-color:#00ff88;box-shadow:0 0 10px #00ff88}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.key{height:60px;background:#1a1a1a;border:1px solid #333;border-radius:12px;color:#fff;font-size:20px;cursor:pointer}.key:active{background:#00ff88;color:#000;transform:scale(.95)}.msg{text-align:center;height:20px;margin-top:10px;font-size:13px;color:#ff5555}.actions{margin-top:20px;display:flex;flex-direction:column;gap:10px}.btn{padding:12px;border-radius:10px;border:none;cursor:pointer;font-weight:bold}.btn-green{background:#00ff88;color:#000}.btn-dark{background:#222;color:#ccc;border:1px solid #333}.link{color:#00ff88;font-size:12px;text-align:center;cursor:pointer;margin-top:15px;text-decoration:underline}.shake{animation:shake .3s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}.success{color:#00ff88!important}</style></head><body><div class="card" id="card"><h1>🔒 PROJECT SUROKKHA-X</h1><p class="sub">BACKUP PERMANENT - PIN LOCKED</p><div style="text-align:center"><span style="background:#1a2e1a;color:#00ff88;padding:4px 12px;border-radius:20px;font-size:11px">● LOCKED - EDITABLE</span></div><div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div><div class="msg" id="msg">Default PIN: 1234</div><div class="keypad"><button class="key" onclick="press(1)">1</button><button class="key" onclick="press(2)">2</button><button class="key" onclick="press(3)">3</button><button class="key" onclick="press(4)">4</button><button class="key" onclick="press(5)">5</button><button class="key" onclick="press(6)">6</button><button class="key" onclick="press(7)">7</button><button class="key" onclick="press(8)">8</button><button class="key" onclick="press(9)">9</button><button class="key" onclick="del()" style="color:#ff5555">⌫</button><button class="key" onclick="press(0)">0</button><button class="key" onclick="check()" style="color:#00ff88">✔</button></div><div class="actions" id="actions" style="display:none"><button class="btn btn-green" onclick="goLocal()">[ GO TO DASHBOARD ]</button><button class="btn btn-dark" onclick="goGit()">Permanent GitHub</button></div><p class="link" onclick="changePin()">Change PIN?</p><p class="link" style="color:#888" onclick="resetPin()">Forgot / Reset to 1234</p></div><script>let pin="";const KEY="surokkha_pin";function getPin(){return localStorage.getItem(KEY)||"1234"}function render(){for(let i=0;i<4;i++)document.getElementById("d"+i).className="dot"+(i<pin.length?" fill":"")}function press(n){if(pin.length<4){pin+=n;render();if(pin.length===4)setTimeout(check,200)}}function del(){pin=pin.slice(0,-1);render()}function check(){if(pin===getPin()){document.getElementById("msg").innerHTML="<span class='success'>✅ UNLOCKED</span>";document.getElementById("actions").style.display="flex";setTimeout(()=>{window.location.href="./dashboard.html"},800)}else{document.getElementById("msg").textContent="❌ Wrong PIN";document.getElementById("card").classList.add("shake");setTimeout(()=>document.getElementById("card").classList.remove("shake"),300);pin="";render()}}function changePin(){let oldp=prompt("Old PIN:");if(oldp!==getPin()){alert("Wrong old");return}let np=prompt("New 4-digit:");if(!/^\d{4}$/.test(np)){alert("4 digit");return}let cp=prompt("Confirm:");if(np!==cp){alert("Not matched");return}localStorage.setItem(KEY,np);alert("Changed: "+np)}function resetPin(){if(confirm("Reset to 1234?")){localStorage.removeItem(KEY);location.reload()}}function goLocal(){location.href="./dashboard.html"}function goGit(){location.href="https://mdsydujjaman.github.io/projectsurokkha-x/backup/permanent/backup/"}render();</script></body></html>
