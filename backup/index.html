<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BACKUP LAB</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:monospace}body{background:#000;color:#0f8;min-height:100vh;padding:12px}header{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #0f83a} .b{padding:3px 10px;border-radius:20px;font-size:10px;font-weight:800}.red{background:#f003;border:1px solid #f0033;color:#ff6b8a}.green{background:#0f82;border:1px solid #0f84;color:#0f8}.card{border:1px solid #0f83;background:#0a0a0a;border-radius:12px;padding:16px;margin-top:14px}input{width:100%;background:#000;border:1px solid #333;border-radius:10px;color:#fff;padding:12px;margin-top:6px}input:focus{border-color:#0f8}label{font-size:11px;letter-spacing:.2em;opacity:.8}button{width:100%;background:#0f8;color:#000;border:0;border-radius:12px;padding:14px;font-weight:900;letter-spacing:.15em;margin-top:14px}pre{background:#000;border:1px solid #222;border-radius:8px;padding:12px;font-size:11px;color:#aaa;white-space:pre-wrap;margin-top:10px}</style></head><body>
<header><b>🔐 BACKUP LAB</b><span class="b red">ROOF DISCONNECTED</span></header>
<div style="margin-top:10px;font-size:11px;opacity:.7">Termux > projectsurokkha-x > <span id="c1" style="background:#0f82;padding:2px 6px;border-radius:4px">{project}</span> > backup > <span id="c2" style="background:#111;border:1px solid #333;padding:2px 6px;border-radius:4px">{step}</span></div>
<div class="card">
<label>project name:</label><input id="pn" placeholder="এখানে যে প্রজেক্টে কাজ করব সেই প্রজেক্টের নাম দিব">
<label style="margin-top:10px;display:block">project step:</label><input id="ps" placeholder="এখানে সেই প্রজেক্টের স্টেপ থাকলে সেই প্রজেক্টের স্টেপ লিখব">
<button onclick="go()">🔒 SECURE BACKUP NOW</button>
<div id="err" style="display:none;color:#f66;font-size:11px;margin-top:10px"></div>
</div>
<div id="res" class="card" style="display:none">
<div style="display:flex;gap:6px"><span class="b green">ROOF LOCKED ✓</span><span class="b green">BACKUP SECURED ✓</span></div>
<div id="pth" style="margin-top:10px;background:#000;border:1px solid #222;border-radius:8px;padding:10px;font-size:11px;color:#fff;word-break:break-all"></div>
<pre id="cmd"></pre>
<button onclick="navigator.clipboard.writeText(document.getElementById('cmd').innerText);alert('Copied!')" style="background:#111;color:#0f8;border:1px solid #0f84">COPY COMMANDS</button>
<div style="margin-top:10px;font-size:10px;opacity:.4">টারমেক্স সরাসরি roof থেকে বিচ্ছিন্ন</div>
</div>
<script>
function s(t){return t.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-_]/g,'')}
function go(){let pn=document.getElementById('pn').value,ps=document.getElementById('ps').value,e=document.getElementById('err');e.style.display='none';if(!pn.trim()||!ps.trim()){e.textContent='⚠️ project name এবং step দুটোই দাও';e.style.display='block';return}let n=s(pn),st=s(ps);document.getElementById('c1').textContent=n;document.getElementById('c2').textContent=st;let path=`~/projectsurokkha-x/${n}/backup/${st}/`;let cmd=`cd ~/projectsurokkha-x\nmkdir -p ${n}/backup/${st}\ncd ${n}/backup/${st}\necho "# ${n} - ${st}" > README.md\nls -la`;document.getElementById('pth').textContent=path;document.getElementById('cmd').textContent=cmd;document.getElementById('res').style.display='block';}
document.getElementById('pn').addEventListener('input',e=>{document.getElementById('c1').textContent=s(e.target.value)||'{project}'});document.getElementById('ps').addEventListener('input',e=>{document.getElementById('c2').textContent=s(e.target.value)||'{step}'});
</script></body></html>
