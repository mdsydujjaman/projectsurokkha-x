<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LOCKED v14 - FIXED</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#00ff88;font-family:monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;touch-action:manipulation}.lock{border:2px solid #00ff88;border-radius:20px;padding:24px;width:92%;max-width:380px;text-align:center;background:#111}h1{font-size:26px}.sub{color:#888;font-size:11px;margin:8px 0 14px}.dots{display:flex;gap:12px;justify-content:center;margin:16px 0}.dot{width:18px;height:18px;border:2px solid #00ff88;border-radius:50%}.dot.on{background:#00ff88}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}button{height:64px;background:#222;border:1px solid #444;border-radius:14px;color:#fff;font-size:24px;font-weight:bold;touch-action:manipulation}button:active{background:#00ff88;color:#000}button.c{background:#ff2a2a}button.ok{background:#00ff88;color:#000;font-size:20px}#msg{height:24px;margin-top:12px;font-size:14px;font-weight:bold;color:#0f8}#pinshow{font-size:12px;color:#666;margin-top:6px;min-height:14px}</style>
</head><body><div class="lock"><h1>🔐 SUROKKHA-X</h1><div class="sub">v14 - One Tap = One Digit<br>PIN 1234</div><div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div><div class="pad">
<button onclick="tap('1')">1</button><button onclick="tap('2')">2</button><button onclick="tap('3')">3</button>
<button onclick="tap('4')">4</button><button onclick="tap('5')">5</button><button onclick="tap('6')">6</button>
<button onclick="tap('7')">7</button><button onclick="tap('8')">8</button><button onclick="tap('9')">9</button>
<button class="c" onclick="clr()">C</button><button onclick="tap('0')">0</button><button class="ok" onclick="go()">OK</button>
</div><div id="msg">PIN দাও: 1 2 3 4</div><div id="pinshow"></div><div style="margin-top:10px;font-size:11px"><a href="./dashboard.html?unlock=1234" style="color:#00ff88">Direct bypass link</a> | Keyboard থেকেও 1234 টাইপ করা যাবে</div></div>
<script>
let pin="", last=0;
function upd(){
  for(let i=0;i<4;i++) document.getElementById('d'+i).className=i<pin.length?'dot on':'dot';
  document.getElementById('msg').innerText=pin?`Entered: ${'*'.repeat(pin.length)} (${pin.length}/4)`:'PIN দাও: 1 2 3 4';
  document.getElementById('pinshow').innerText=pin?`Debug: ${pin}`:'';
}
function tap(n){
  const now=Date.now();
  if(now-last<350) return; // block double
  last=now;
  if(pin.length>=4) return;
  pin+=n;
  upd();
  if(pin.length==4) setTimeout(go,350);
}
function clr(){pin=""; upd();}
function go(){
  const m=document.getElementById('msg');
  if(pin.length!==4){m.innerText=`❌ ${pin.length}/4 দিয়েছো`;m.style.color='#f44';return;}
  if(pin!=="1234"){m.innerText=`❌ Wrong: ${pin}`;m.style.color='#f44';pin="";upd();return;}
  m.innerText='✅ OK! যাচ্ছি...';m.style.color='#0f8';
  try{sessionStorage.setItem("surokkha_temp","1");localStorage.setItem("surokkha_temp","1");}catch(e){}
  location.href="./dashboard.html";
}
document.addEventListener('keydown',e=>{
  if(e.key>='0'&&e.key<='9') tap(e.key);
  if(e.key==='Enter') go();
  if(e.key==='Backspace'||e.key==='Escape') clr();
});
upd();
</script></body></html>
