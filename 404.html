<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>LOCKED</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#00ff88;font-family:monospace;min-height:100vh;display:flex;align-items:center;justify-content:center}.lock{border:2px solid #00ff88;border-radius:20px;padding:30px;width:90%;max-width:380px;text-align:center;background:#111;box-shadow:0 0 40px #00ff8855}h1{font-size:26px}.sub{color:#888;font-size:12px;margin:10px 0 20px}.dots{display:flex;gap:10px;justify-content:center;margin:15px 0}.dot{width:16px;height:16px;border:2px solid #00ff88;border-radius:50%}.dot.on{background:#00ff88}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}button{height:58px;background:#1e1e1e;border:1px solid #333;border-radius:12px;color:#fff;font-size:20px;font-weight:bold}button:active{background:#00ff88;color:#000;transform:scale(.93)}button.c{background:#ff2a2a}button.ok{background:#00ff88;color:#000}#msg{height:18px;margin-top:12px;font-size:13px}</style></head>
<body><div class="lock"><h1>🔐 SUROKKHA-X</h1><div class="sub">MAIN VAULT - Refresh = Lock<br>PIN 1234</div><div class="dots"><div class="dot" id="d0"></div><div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div></div><div class="pad"><button onclick="p('1')">1</button><button onclick="p('2')">2</button><button onclick="p('3')">3</button><button onclick="p('4')">4</button><button onclick="p('5')">5</button><button onclick="p('6')">6</button><button onclick="p('7')">7</button><button onclick="p('8')">8</button><button onclick="p('9')">9</button><button class="c" onclick="clr()">C</button><button onclick="p('0')">0</button><button class="ok" onclick="go()">OK</button></div><div id="msg"></div><div style="margin-top:12px;font-size:10px;color:#555">Refresh করলেই আবার Lock</div></div>
<script>let pin="";function upd(){for(let i=0;i<4;i++)document.getElementById('d'+i).className=i<pin.length?'dot on':'dot'}function p(n){if(pin.length<4){pin+=n;upd();if(pin.length==4)setTimeout(go,250)}}function clr(){pin="";upd();document.getElementById('msg').innerText=""}function go(){let m=document.getElementById('msg');if(pin!=="1234"){m.innerText="❌ Wrong! 1234";m.style.color="#f44";pin="";upd();return;}m.innerText="✅ OK...";m.style.color="#0f8";try{sessionStorage.setItem("surokkha_temp","1");}catch(e){}setTimeout(()=>{window.location.href="./dashboard.html";},400);}</script></body></html>
